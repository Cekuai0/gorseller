<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matmazel Koku — Parfüm Koleksiyonu</title>
<meta name="description" content="Matmazel Koku parfüm koleksiyonu. Kadın, erkek ve unisex parfümler, güncel fiyat listesi ve WhatsApp ile hızlı sipariş.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700;700i&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191714'/%3E%3Ctext x='16' y='22' font-size='16' font-family='serif' fill='%23C9A227' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF7F2;
  --bg-2:#F3EDE4;
  --surface:#FFFFFF;
  --border:#E9E1D4;
  --border-strong:#D9C7A5;
  --text:#191714;
  --text2:#4C4740;
  --muted:#8C8478;
  --gold:#A07D3D;
  --gold-2:#C9A227;
  --gold-soft:#F6F0E4;
  --ink:#17150F;
  --tint:#F4F0E9;
  --radius:18px;
  --shadow-sm:0 1px 2px rgba(25,23,20,.04), 0 6px 18px -12px rgba(25,23,20,.18);
  --shadow-lg:0 30px 60px -32px rgba(94,70,28,.45);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  margin:0;padding:0;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(201,162,39,.10), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(160,125,61,.08), transparent 55%);
}
img{display:block}
button{font-family:inherit}
::selection{background:var(--gold);color:#fff}

/* ---------- Scrollbar ---------- */
*::-webkit-scrollbar{height:8px;width:9px}
*::-webkit-scrollbar-thumb{background:#DED3C0;border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- Topbar / Nav ---------- */
.topbar{
  position:relative;z-index:5;
  background:var(--ink);color:#EADFC8;
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  text-align:center;padding:9px 16px;font-weight:500;
}
.topbar span{opacity:.85}
.navbar{
  position:sticky;top:0;z-index:50;
  background:rgba(250,247,242,.82);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
  transition:box-shadow .3s var(--ease);
}
.navbar.scrolled{box-shadow:0 10px 30px -22px rgba(25,23,20,.5)}
.nav-inner{
  max-width:1220px;margin:0 auto;padding:0 20px;height:66px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;text-decoration:none;color:inherit}
.logo-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(145deg,#211E18,#403728);
  color:var(--gold-2);display:grid;place-items:center;
  font-family:'Inter',system-ui,sans-serif;font-size:21px;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.35);
}
.logo-text{line-height:1.05}
.logo-text b{
  display:block;font-family:'Inter',system-ui,sans-serif;
  font-size:21px;font-weight:700;letter-spacing:.02em;
}
.logo-text small{
  display:block;font-size:9.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:1px;
}
.nav-actions{display:flex;align-items:center;gap:10px}
.nav-link{
  display:none;color:var(--text2);text-decoration:none;font-size:13.5px;
  font-weight:500;padding:8px 12px;border-radius:99px;transition:.2s var(--ease);
}
.nav-link:hover{color:var(--gold);background:var(--gold-soft)}
@media(min-width:900px){.nav-link{display:inline-block}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;text-decoration:none;font-weight:600;
  border-radius:99px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s,color .25s;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-wa{
  background:linear-gradient(135deg,#25D366,#15B455);color:#fff;
  font-size:13.5px;padding:10px 18px;
  box-shadow:0 10px 24px -12px rgba(21,180,85,.9);
}
.btn-wa:hover{box-shadow:0 16px 30px -14px rgba(21,180,85,.95);transform:translateY(-1px)}
.btn-wa.lg{font-size:15px;padding:15px 26px;width:100%}
.btn-ghost{
  background:transparent;border:1px solid var(--border-strong);color:var(--gold);
  font-size:12.5px;padding:8px 15px;
}
.btn-ghost:hover{background:var(--gold-soft)}
.btn-dark{background:var(--ink);color:#F3E7CC;font-size:14px;padding:13px 24px}
.btn-dark:hover{background:#2B251B}

/* ---------- Hero ---------- */
.hero{
  position:relative;z-index:1;overflow:hidden;
  border-bottom:1px solid var(--border);
  background:
    radial-gradient(700px 320px at 50% 0%, rgba(201,162,39,.14), transparent 70%),
    linear-gradient(180deg,#FDFBF7,#F5EFE5);
}
.hero-inner{
  max-width:1220px;margin:0 auto;padding:62px 20px 56px;text-align:center;
  position:relative;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  color:var(--gold);font-size:11px;letter-spacing:.34em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--border-strong);background:rgba(255,255,255,.6);
  padding:7px 16px;border-radius:99px;
}
.hero h1{
  font-family:'Inter',system-ui,sans-serif;
  font-size:clamp(36px,6.4vw,64px);font-weight:700;letter-spacing:-.01em;
  line-height:1.05;margin:20px 0 0;
}
.hero h1 em{font-style:italic;color:var(--gold);}
.hero p{
  color:var(--text2);font-size:clamp(14.5px,1.6vw,16.5px);line-height:1.75;
  max-width:560px;margin:18px auto 0;
}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto 0}
.ornament i{display:block;width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--border-strong))}
.ornament i+i{background:linear-gradient(90deg,var(--border-strong),transparent)}
.ornament span{color:var(--gold-2);font-size:12px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:620px;margin:40px auto 0;
}
.stat{
  background:rgba(255,255,255,.72);border:1px solid var(--border);
  border-radius:14px;padding:14px 10px;
}
.stat b{display:block;font-family:'Inter',system-ui,sans-serif;font-size:24px;color:var(--gold);line-height:1}
.stat span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}

/* ---------- Layout ---------- */
.container{max-width:1220px;margin:0 auto;padding:38px 20px 80px;position:relative;z-index:1}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.section-head h2{
  font-family:'Inter',system-ui,sans-serif;font-size:30px;font-weight:700;margin:0;letter-spacing:-.01em;
}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- Toolbar ---------- */
.toolbar{
  position:sticky;top:66px;z-index:30;
  background:rgba(250,247,242,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:22px;box-shadow:var(--shadow-sm);
}
.controls-bar{display:flex;flex-direction:column;gap:12px}
@media(min-width:900px){.controls-bar{flex-direction:row;justify-content:space-between;align-items:center}}
.search-box{position:relative;width:100%;max-width:360px}
.search-box input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:99px;height:44px;
  padding:0 16px 0 42px;font-family:inherit;font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-box input::placeholder{color:#AFA79A}
.search-box input:focus{border-color:var(--border-strong);box-shadow:0 0 0 4px rgba(201,162,39,.13)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.filter-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill-btn{
  height:40px;padding:0 18px;border-radius:99px;
  background:var(--surface);color:var(--text2);border:1px solid var(--border);
  font-size:13.5px;font-weight:500;cursor:pointer;
  transition:.22s var(--ease);white-space:nowrap;
}
.pill-btn:hover{border-color:var(--border-strong);color:var(--text)}
.pill-btn.active{
  background:linear-gradient(135deg,#2A2419,var(--ink));color:#F0E2C3;border-color:var(--ink);
  box-shadow:0 10px 22px -14px rgba(25,23,20,.9);
}
.sub-bar-wrapper{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.sub-bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sort-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
.product-count-badge{color:var(--muted);font-size:12.5px;font-weight:500}
.product-count-badge b{color:var(--text);font-weight:600}
.view-switcher{
  display:inline-flex;background:var(--bg-2);border:1px solid var(--border);
  border-radius:99px;padding:4px;gap:2px;
}
.view-btn{
  border:none;cursor:pointer;padding:8px 15px;border-radius:99px;
  font-size:12.5px;font-weight:600;background:transparent;color:var(--text2);
  transition:.22s var(--ease);
}
.view-btn:hover{color:var(--text)}
.view-btn.active{background:var(--surface);color:var(--gold);box-shadow:var(--shadow-sm)}

/* ---------- Grid / Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}
@media(min-width:1320px){.grid{grid-template-columns:repeat(4,1fr)}}

.pcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;height:100%;cursor:pointer;
  position:relative;isolation:isolate;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s var(--ease);
  animation:fadeUp .5s var(--ease) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pcard:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.img-container{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,#F7F2E9,#EFE7D9);overflow:hidden}
.img-container::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(25,23,20,.18));
  opacity:0;transition:opacity .45s var(--ease);
}
.pcard:hover .img-container::after{opacity:1}
.img-container img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.pcard:hover img{transform:scale(1.07)}
.img-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.ptag{
  position:absolute;top:12px;left:12px;z-index:2;
  background:rgba(255,255,255,.93);backdrop-filter:blur(6px);
  color:var(--gold);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid var(--border);
}
.pcard-body{padding:15px;display:flex;flex-direction:column;flex:1}
@media(min-width:640px){.pcard-body{padding:18px}}
.pname{
  color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:600;
  font-size:17px;line-height:1.3;margin:0;min-height:44px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
@media(min-width:640px){.pname{font-size:19px;min-height:50px}}
.card-footer{margin-top:auto;padding-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--border)}
.pprice{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:21px;font-weight:700;white-space:nowrap}
@media(min-width:640px){.pprice{font-size:24px}}
.pprice small{font-size:13px;color:var(--muted);font-family:'Inter',system-ui,sans-serif;font-weight:500}
.pcta{
  color:var(--gold);font-size:12px;display:inline-flex;align-items:center;gap:5px;font-weight:600;
  opacity:0;transform:translateX(-6px);transition:opacity .35s var(--ease),transform .35s var(--ease);white-space:nowrap;
}
.pcard:hover .pcta{opacity:1;transform:none}
@media(hover:none){.pcta{opacity:1;transform:none}}

/* ---------- Admin ---------- */
.admin-card-actions{background:var(--tint);padding:9px 12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.admin-btn{padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:.2s}
.admin-btn:hover{filter:brightness(1.07)}
.admin-btn-edit{background:#E3A008;color:#fff}
.admin-btn-delete{background:#E0483B;color:#fff}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,17,12,.62);backdrop-filter:blur(5px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-content{
  background:var(--surface);border-radius:20px;padding:26px;max-width:520px;width:100%;
  max-height:86vh;overflow-y:auto;border:1px solid var(--border-strong);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:pop .3s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:5px}
.form-group input{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--bg);transition:.2s}
.form-group input:focus{border-color:var(--border-strong);background:#fff;box-shadow:0 0 0 4px rgba(201,162,39,.12)}

/* ---------- List view ---------- */
.list-view{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.list-row{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;border-top:1px solid var(--border);transition:background .2s var(--ease)}
.list-row:first-child{border-top:none}
.list-row:hover{background:var(--gold-soft)}
.list-img{width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--tint);flex-shrink:0;border:1px solid var(--border)}
.list-img img{width:100%;height:100%;object-fit:cover}
.list-cat{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.list-name{font-family:'Inter',system-ui,sans-serif;font-weight:600;color:var(--text);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.list-price{font-family:'Inter',system-ui,sans-serif;color:var(--text);font-size:19px;font-weight:700;white-space:nowrap}

/* ---------- Price table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.price-table{width:100%;border-collapse:collapse;min-width:520px}
.price-table th{background:var(--bg-2);padding:13px 16px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;white-space:nowrap}
.price-table td{padding:14px 16px;font-size:14px;color:var(--text2);text-align:center;border-top:1px solid var(--border)}
.price-table tbody tr{transition:background .2s}
.price-table tbody tr:hover{background:var(--gold-soft);cursor:pointer}
.tbl-name{text-align:left!important;font-family:'Inter',system-ui,sans-serif;color:var(--text);font-weight:600;font-size:17px}
.tbl-price{text-align:right!important;font-family:'Inter',system-ui,sans-serif;color:var(--text);font-weight:700;font-size:18px}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid var(--border);padding:4px 10px;border-radius:99px}

/* ---------- Detail ---------- */
.detail-grid{display:grid;grid-template-columns:1fr;gap:28px}
@media(min-width:1024px){.detail-grid{grid-template-columns:1.02fr .98fr;gap:52px;align-items:start}}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:22px;font-weight:600;cursor:pointer;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);transition:.22s var(--ease)}
.back-link:hover{color:var(--text);border-color:var(--border-strong);background:var(--gold-soft)}
.gal-wrap{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm)}
.gal-main{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,#F8F3EA,#EFE7D9);cursor:zoom-in}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-count{position:absolute;left:14px;bottom:14px;background:rgba(25,23,20,.78);color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:99px;backdrop-filter:blur(4px)}
.gal-zoom{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.92);color:var(--text2);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--border)}
.thumb-list{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.thumb-btn{flex:0 0 auto;width:76px;height:76px;padding:0;border-radius:14px;overflow:hidden;background:var(--tint);border:1px solid var(--border);cursor:pointer;transition:.22s var(--ease)}
.thumb-btn:hover{border-color:var(--border-strong)}
.thumb-btn.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.thumb-btn img{width:100%;height:100%;object-fit:cover}
.detail-cat{display:inline-block;color:var(--gold);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;border:1px solid var(--border-strong);border-radius:99px;padding:6px 14px;background:var(--gold-soft)}
.detail-brand{color:var(--muted);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;margin-top:18px}
.detail-title{font-family:'Inter',system-ui,sans-serif;font-size:clamp(30px,4.6vw,46px);font-weight:700;margin:10px 0 16px;line-height:1.1;letter-spacing:-.01em}
.detail-price{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:38px;font-weight:700;line-height:1}
.detail-price small{font-size:14px;color:var(--muted);font-family:'Inter',system-ui,sans-serif;font-weight:500;margin-left:6px}
.rule{width:100%;height:1px;background:linear-gradient(90deg,var(--border-strong),transparent);margin:24px 0}
.detail-desc{color:var(--text2);font-size:15px;line-height:1.8;white-space:pre-wrap;margin:0}
.detail-actions{display:flex;flex-direction:column;gap:11px;margin-top:28px}
.btn-share{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);padding:14px;font-size:14px;font-weight:600;border-radius:99px;cursor:pointer;transition:.22s var(--ease)}
.btn-share:hover{background:var(--gold-soft)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.trust div{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 10px;text-align:center}
.trust b{display:block;font-size:12px;color:var(--text);font-weight:600}
.trust span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}

/* ---------- Lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:99999;background:rgba(18,16,12,.95);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
.lightbox img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:10px;box-shadow:0 40px 80px -30px #000}

function favoriteKey(item){ return String(item.uniqueId || item["Parfüm Adı"] || ''); }
function updateFavoriteCount(){ const el = document.getElementById('favCount'); if(el) el.textContent = favorites.size; }
function toggleFavorite(event, index){
  event.stopPropagation(); const key = favoriteKey(allProducts[index]);
  if(favorites.has(key)) favorites.delete(key); else favorites.add(key);
  try { localStorage.setItem('matmazel_favorites', JSON.stringify([...favorites])); } catch(e) {}
  updateFavoriteCount(); renderCatalog();
}
function showFavorites(){
  favoritesOnly = !favoritesOnly;
  if(new URLSearchParams(location.search).has('urun')) { history.pushState({}, '', location.pathname); }
  renderCatalog(); if(!filterSheetOpen) setTimeout(scrollToCatalog, 0);
}

async function initApp(){
  renderSkeleton();
  try{
    let timer;
    try {
      allProducts = await Promise.race([
        fetch(API_URL).then(res => {
          if(!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }),
        new Promise((resolve, reject) => { timer = setTimeout(() => reject(new Error('timeout')), 15000); })
      ]);
    } finally { clearTimeout(timer); }
    if(!Array.isArray(allProducts)) throw new Error('invalid data');
    isDemoData = false;
  }catch(err){
    console.warn('Katalog verisi alınamadı:', err);
    document.getElementById('app').innerHTML = `<div class="container"><div class="empty-state"><h3>Katalog yüklenemedi</h3><p>Bağlantınızı kontrol edip tekrar deneyin. Sorun devam ederse WhatsApp üzerinden bize ulaşabilirsiniz.</p><button class="pill-btn active" type="button" onclick="initApp()">Tekrar dene</button></div></div>`;
    return;
  }
  handleRoute();
}

function renderSkeleton(){
  const cards = Array.from({length:8}).map(()=>`
    <div class="sk">
      <div class="sk-img shimmer"></div>
      <div class="sk-line shimmer"></div>
      <div class="sk-line short shimmer"></div>
    </div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="container"><div class="skeleton-grid">${cards}</div></div>`;
}

function handleRoute(){
  const params = new URLSearchParams(window.location.search);
  const detailIndex = params.get('urun');
  if (detailIndex !== null && allProducts[detailIndex]) {
    renderDetail(allProducts[detailIndex], detailIndex);
  } else {
    renderCatalog();
  }
}

function formatPrice(val){
  const n = Number(val);
  if (Number.isNaN(n)) return "0,00";
  return n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getImages(item){
  const raw = item["Görseller"];
  if(!raw) return [];
  return String(raw).split(";").map(s=>s.trim()).filter(Boolean);
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function scrollToCatalog(){
  const el = document.getElementById('katalog');
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function navCategory(cat){
  goBackToCatalog();
  setTimeout(()=>{ setCategory(cat); scrollToCatalog(); }, 60);
}

// ==================== SUNUCU TARAFLI GÜVENLİ ADMIN GİRİŞİ ====================
async function toggleAdminLogin(){
  if (isAdminLoggedIn){
    isAdminLoggedIn = false;
    alert("Admin modundan çıkış yapıldı.");
    renderCatalog();
  } else {
    const pwd = prompt("Admin Şifrenizi Girin:");
    if(!pwd) return;
    try{
      const res = await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"login",password:pwd})});
      const result = await res.json();
      if(result.status === "success"){
        isAdminLoggedIn = true;
        alert("Admin Modu Aktif!");
        renderCatalog();
      } else {
        alert("Hatalı Şifre!");
      }
    }catch(err){
      alert("Sunucu bağlantı hatası!");
    }
  }
}

async function deleteProduct(e, productName){
  e.stopPropagation();
  if(!confirm(`"${productName}" adlı ürünü silmek istediğinize emin misiniz?`)) return;
  try{
    const res = await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"delete",productName:productName})});
    const result = await res.json();
    if(result.status === "success"){
      alert("Ürün başarıyla silindi!");
      allProducts = allProducts.filter(p => p["Parfüm Adı"] !== productName);
      renderCatalog();
    } else {
      alert("Hata: " + result.message);
    }
  }catch(err){ alert("Bağlantı hatası!"); }
}

function openEditModal(e, item){
  e.stopPropagation();
  editingItem = { ...item };
  renderEditModal();
}

function renderEditModal(){
  if(!editingItem) return;
  const existingModal = document.getElementById('adminModal');
  if(existingModal) existingModal.remove();

  const modal = document.createElement('div');
  modal.id = 'adminModal';
  modal.className = 'modal-overlay';

  let fieldsHtml = '';
  Object.keys(editingItem).forEach(key=>{
    if(key === 'rowIndex' || key === 'uniqueId') return;
    fieldsHtml += `
      <div class="form-group">
        <label>${esc(key)}</label>
        <input type="text" id="field_${key}" value="${esc(editingItem[key] || '')}">
      </div>`;
  });

  modal.innerHTML = `
    <div class="modal-content">
      <h3 style="font-family:'Inter',system-ui,sans-serif; margin:0 0 4px; font-size:24px; font-weight:700;">Ürünü Düzenle</h3>
      <p style="color:var(--muted); font-size:12.5px; margin:0 0 18px;">Alanları güncelleyip kaydedin.</p>
      <form onsubmit="saveProductEdit(event)">
        ${fieldsHtml}
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
          <button type="button" onclick="closeEditModal()" class="pill-btn">İptal</button>
          <button type="submit" class="pill-btn active">Kaydet</button>
        </div>
      </form>
    </div>`;
  modal.onclick = (e)=>{ if(e.target === modal) closeEditModal(); };
  document.body.appendChild(modal);
}

function closeEditModal(){
  const modal = document.getElementById('adminModal');
  if(modal) modal.remove();
  editingItem = null;
}

async function saveProductEdit(e){
  e.preventDefault();
  const originalName = editingItem["Parfüm Adı"];
  const updatedFields = {};
  Object.keys(editingItem).forEach(key=>{
    const input = document.getElementById(`field_${key}`);
    if(input) updatedFields[key] = input.value;
  });
  try{
    const res = await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"update",productName:originalName,fields:updatedFields})});
    const result = await res.json();
    if(result.status === "success"){
      alert("Ürün güncellendi!");
      closeEditModal();
      const idx = allProducts.findIndex(p => p["Parfüm Adı"] === originalName);
      if(idx !== -1) allProducts[idx] = updatedFields;
      renderCatalog();
    } else {
      alert("Güncelleme hatası: " + result.message);
    }
  }catch(err){ alert("Bağlantı hatası!"); }
}

let filterSheetOpen = false;
function sheetChip(label, active, action){
  return `<button class="sheet-chip${active ? ' active' : ''}" onclick="${action}">${esc(label)}</button>`;
}
function filterSheet(count){
  const cats = ['Tümü','Kadın','Erkek','Unisex'];
  const sorts = [['newest','Yeniden Eskiye'],['price-asc','Fiyat Artan'],['price-desc','Fiyat Azalan']];
  const views = [['galeri','Galeri'],['liste','Liste'],['fiyat','Fiyat Tablosu']];
  const op = filterSheetOpen ? ' open' : '';
  return `<div class="sheet-backdrop${op}" id="sheetBackdrop" onclick="toggleFilterSheet(false)"></div>
  <div class="filter-sheet${op}" id="filterSheet" role="dialog" aria-modal="true" aria-label="Filtrele ve sırala">
    <div class="sheet-head"><span class="sheet-grip"></span>
      <div class="sheet-title">Filtrele &amp; Sırala<button class="sheet-close" onclick="toggleFilterSheet(false)" aria-label="Kapat">✕</button></div>
    </div>
    <div class="sheet-body">
      <div class="sheet-group"><span class="sheet-label">Kategori</span><div class="sheet-chips">
        ${cats.map(c => sheetChip(c, !favoritesOnly && currentCategory === c, `setCategory('${c}')`)).join('')}
        ${sheetChip('♡ Favorilerim (' + favorites.size + ')', favoritesOnly, 'showFavorites()')}
      </div></div>
      <div class="sheet-group"><span class="sheet-label">Sıralama</span><div class="sheet-chips">
        ${sorts.map(([v,l]) => sheetChip(l, currentSort === v, `setSort('${v}')`)).join('')}
      </div></div>
      <div class="sheet-group"><span class="sheet-label">Görünüm</span><div class="sheet-chips">
        ${views.map(([v,l]) => sheetChip(l, currentView === v, `setView('${v}')`)).join('')}
      </div></div>
    </div>
    <div class="sheet-foot"><button class="sheet-apply" onclick="toggleFilterSheet(false)"><b>${count}</b> ürünü göster</button></div>
  </div>`;
}
function toggleFilterSheet(open){
  filterSheetOpen = !!open;
  const sheet = document.getElementById('filterSheet');
  const back = document.getElementById('sheetBackdrop');
  if(sheet) sheet.classList.toggle('open', filterSheetOpen);
  if(back) back.classList.toggle('open', filterSheetOpen);
  document.body.classList.toggle('sheet-open', filterSheetOpen);
}
function brandTicker(){
  const content = DEFAULT_BRANDS.map(x => `<span>${esc(x)}</span><i>✦</i>`).join('');
  return `<div class="brand-ticker" aria-label="Markalar"><div class="ticker-track"><div>${content}</div><div aria-hidden="true">${content}</div></div></div>`;
}

    const matchesCat = currentCategory === "Tümü" || cat.toLowerCase() === currentCategory.toLowerCase();
    return matchesSearch && matchesCat && (!favoritesOnly || favorites.has(favoriteKey(item)));
  });

  if (currentSort === "newest") {
    filtered = [...filtered];
  } else if (currentSort === "price-asc") {
    filtered.sort((a,b)=>Number(a["Fiyat"]||0)-Number(b["Fiyat"]||0));
  } else if (currentSort === "price-desc") {
    filtered.sort((a,b)=>Number(b["Fiyat"]||0)-Number(a["Fiyat"]||0));
  }

  const adminBtn = document.getElementById('adminNavBtn');
  if(adminBtn) adminBtn.innerHTML = isAdminLoggedIn ? '🔓 Admin Çıkış' : '🔒 Admin';

  const activeFilterCount = (currentCategory !== 'Tümü' ? 1 : 0) + (currentSort !== 'newest' ? 1 : 0) + (currentView !== 'galeri' ? 1 : 0) + (favoritesOnly ? 1 : 0);

      <div class="section-head">
        <div>
          <h2>${favoritesOnly ? "Favorilerim" : "Koleksiyonu keşfedin"}</h2>
          <p>Katalogda olan tüm ürünler mevcuttur.</p>
        </div>
      </div>

      <div class="mobile-filterbar">
        <div class="search-box m-search">
          <span class="search-icon">🔍</span>
          <input type="text" id="mSearchInput" placeholder="Parfüm ara..." value="${esc(searchQuery)}" oninput="onSearchInput(this)">
        </div>
        <button class="m-filter-btn${activeFilterCount ? ' has' : ''}" onclick="toggleFilterSheet(true)">
          <span aria-hidden="true">⚙</span> Filtre${activeFilterCount ? `<b>${activeFilterCount}</b>` : ''}

      </div>

      <div class="toolbar">
        <div class="controls-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Parfüm ara..." value="${esc(searchQuery)}" oninput="onSearchInput(this)">

            <button class="pill-btn ${!favoritesOnly && currentCategory === 'Tümü' ? 'active' : ''}" onclick="setCategory('Tümü')">Tümü</button>
            <button class="pill-btn ${!favoritesOnly && currentCategory === 'Kadın' ? 'active' : ''}" onclick="setCategory('Kadın')">Kadın</button>
            <button class="pill-btn ${!favoritesOnly && currentCategory === 'Erkek' ? 'active' : ''}" onclick="setCategory('Erkek')">Erkek</button>
            <button class="pill-btn ${!favoritesOnly && currentCategory === 'Unisex' ? 'active' : ''}" onclick="setCategory('Unisex')">Unisex</button>
            <button class="pill-btn ${favoritesOnly ? 'active' : ''}" onclick="showFavorites()">♡ Favorilerim <span>(${favorites.size})</span></button>

function renderProductContent(list){
  if(list.length === 0){
    return `<div class="empty-state">
      <h3>Sonuç bulunamadı</h3>
      <p>Aradığınız kriterde ürün bulunamadı. Filtreleri temizleyip tekrar deneyin.</p>
      <button class="pill-btn active" style="margin-top:16px" onclick="setCategory('Tümü')">Tüm Ürünleri Göster</button>
    </div>`;
  }

  const productIndexes = new Map(allProducts.map((item, index) => [item, index]));
  const getOriginalIndex = (item) => productIndexes.get(item);

  if (currentView === 'galeri') {
    return `<div class="grid">
      ${list.map((item,i)=>{
        const imgs = getImages(item);
        const origIdx = getOriginalIndex(item);
        const name = item["Parfüm Adı"] || "";
        const cat = item["Kategori"] || "";
        const price = formatPrice(item["Fiyat"]);
        return `
          <div class="pcard" onclick="goToDetail(${origIdx})">
            <div class="img-container">
              <button class="favorite-btn ${favorites.has(favoriteKey(item)) ? 'selected' : ''}" aria-label="${favorites.has(favoriteKey(item)) ? 'Favorilerden çıkar' : 'Favorilere ekle'}" aria-pressed="${favorites.has(favoriteKey(item))}" onclick="toggleFavorite(event, ${origIdx})">${favorites.has(favoriteKey(item)) ? '♥' : '♡'}</button>
              ${imgs[0] ? `<img src="${imgs[0]}" alt="${esc(name)}" loading="lazy" decoding="async">` : '<div class="img-empty">Görsel yok</div>'}
              ${cat ? `<span class="ptag">${esc(cat)}</span>` : ''}
            </div>
            <div class="pcard-body">
              <h3 class="pname">${esc(name)}</h3>
              <div class="card-footer">
                <div class="pprice">₺${price}</div>
                <span class="pcta">İncele →</span>
              </div>
            </div>
            ${isAdminLoggedIn ? `
              <div class="admin-card-actions">
                <button class="admin-btn admin-btn-edit" onclick="openEditModal(event, ${JSON.stringify(item).replace(/"/g,'&quot;')})">✏️ Düzenle</button>
                <button class="admin-btn admin-btn-delete" onclick="deleteProduct(event, '${String(name).replace(/'/g,"\\'")}')">🗑️ Sil</button>
              </div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
  } else if (currentView === 'liste') {
    return `<div class="list-view">
      ${list.map(item=>{
        const imgs = getImages(item);
        const origIdx = getOriginalIndex(item);
        const name = item["Parfüm Adı"] || "";
        const cat = item["Kategori"] || "";
        const price = formatPrice(item["Fiyat"]);
        return `
          <div class="list-row" onclick="goToDetail(${origIdx})">
            <div class="list-img">${imgs[0] ? `<img src="${imgs[0]}" alt="${esc(name)}" loading="lazy" decoding="async">` : ''}</div>

              ${cat ? `<div class="list-cat">${esc(cat)}</div>` : ''}
              <div class="list-name">${esc(name)}</div>
            </div>
            <div class="list-price">₺${price}</div>
            ${isAdminLoggedIn ? `
              <div style="display:flex; gap:4px; margin-left:10px;">
                <button class="admin-btn admin-btn-edit" onclick="openEditModal(event, ${JSON.stringify(item).replace(/"/g,'&quot;')})">✏️</button>
                <button class="admin-btn admin-btn-delete" onclick="deleteProduct(event, '${String(name).replace(/'/g,"\\'")}')">🗑️</button>
              </div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
  } else {
    return `<div class="table-wrap"><table class="price-table">
      <thead>
        <tr>

          <th style="text-align:left;">Ürün</th>

        </tr>
      </thead>
      <tbody>
        ${list.map((item,idx)=>{
          const origIdx = getOriginalIndex(item);
          const name = item["Parfüm Adı"] || "";
          const cat = item["Kategori"] || "—";
          const price = formatPrice(item["Fiyat"]);
          return `
            <tr onclick="goToDetail(${origIdx})">
              <td style="color:var(--muted);">${idx+1}</td>
              <td class="tbl-name">${esc(name)}</td>
              <td><span class="chip">${esc(cat)}</span></td>
              <td class="tbl-price">₺${price}</td>
              ${isAdminLoggedIn ? `
                <td>
                  <button class="admin-btn admin-btn-edit" onclick="openEditModal(event, ${JSON.stringify(item).replace(/"/g,'&quot;')})">✏️</button>

        }).join('')}
      </tbody>
    </table></div>`;
  }
}

// ==================== DETAY GÖRÜNÜMÜ ====================
let activeImageIdx = 0;

function getBrand(item){
  const explicit = String(item["Marka"] || item["Brand"] || "").trim();
  if(explicit) return explicit;
  const name = String(item["Parfüm Adı"] || "").trim();
  return [...DEFAULT_BRANDS].sort((a,b)=>b.length-a.length).find(brand => name.toLocaleLowerCase('tr-TR').startsWith(brand.toLocaleLowerCase('tr-TR') + ' ') || name.toLocaleLowerCase('tr-TR') === brand.toLocaleLowerCase('tr-TR')) || "";
}
function getVolume(item){
  const raw = item["Hacim"] || item["Hacim (ml)"] || item["ML"] || item["Ml"] || "";
  const src = String(raw) || String(item["Parfüm Adı"] || "");
  const m = src.match(/(\d+(?:[.,]\d+)?)\s*ml/i);
  if(m) return m[1].replace(",", ".") + " ml";
  return raw && /^\d+(?:[.,]\d+)?$/.test(String(raw).trim()) ? String(raw).trim() + " ml" : "";
}

function renderDetail(item, index){
  document.getElementById('tickerRoot').hidden = true;
  const name = item["Parfüm Adı"] || "";
  const cat = item["Kategori"] || "";
  const price = formatPrice(item["Fiyat"]);
  const desc = item["Açıklama"] || "";
  const images = getImages(item);
  const currentImgUrl = images[activeImageIdx] || "";
  const detailUrl = window.location.href;
  const brandName = getBrand(item);
  const volume = getVolume(item);
  const displayName = name.replace(/\s*\b\d+(?:[.,]\d+)?\s*ml\b\.?/gi, "").trim() || name;

  document.getElementById('app').innerHTML = `
    <div class="container">
      <a class="back-link" onclick="goBackToCatalog()">← Katalog'a dön</a>

      <div class="detail-grid">
        <div>
          <div class="gal-wrap">
            <div class="gal-main" onclick="openLightbox(${activeImageIdx})">
              ${currentImgUrl ? `<img src="${currentImgUrl}" alt="${esc(name)}">` : '<div class="img-empty">Görsel yok</div>'}
              ${images.length > 1 ? `<div class="gal-count">${activeImageIdx+1} / ${images.length}</div>` : ''}
              ${currentImgUrl ? `<div class="gal-zoom">🔍 Büyüt</div>` : ''}
            </div>
          </div>
          ${images.length > 1 ? `
            <div class="thumb-list">
              ${images.map((img,i)=>`
                <button class="thumb-btn ${i===activeImageIdx?'active':''}" onclick="setActiveImage(${i})">
                  <img src="${img}" alt="">
                </button>`).join('')}
            </div>` : ''}
        </div>

        <div>
          ${cat ? `<span class="detail-cat">${esc(cat)}</span>` : ''}
          ${brandName ? `<div class="detail-brand">${esc(brandName)}</div>` : ''}
          <h1 class="detail-title">${esc(displayName)}</h1>
          <div class="detail-price">₺${price}</div>
          <div class="rule"></div>
          ${desc ? `<p class="detail-desc">${esc(desc)}</p>` : '<p class="detail-desc" style="color:var(--muted)">Bu ürün için detaylı açıklama yakında eklenecektir. Bilgi almak için WhatsApp üzerinden bize yazabilirsiniz.</p>'}

          <div class="detail-specs">
            ${brandName ? `<div><span>Marka</span><b>${esc(brandName)}</b></div>` : ''}
            ${volume ? `<div><span>Hacim</span><b>${esc(volume)}</b></div>` : ''}
            ${cat ? `<div><span>Kategori</span><b>${esc(cat)}</b></div>` : ''}
          </div>

          <div class="detail-actions">
            <button class="btn btn-wa lg" onclick="orderWhatsApp('${String(name).replace(/'/g,"\\'")}', '${detailUrl}')">💬 WhatsApp'tan Sipariş Ver</button>
            <button class="btn-share" onclick="shareProduct('${String(name).replace(/'/g,"\\'")}', '${detailUrl}')">🔗 Ürünü Paylaş</button>
          </div>

        </div>
      </div>
    </div>`;
}

// ==================== ETKİLEŞİM FONKSİYONLARI ====================
function setCategory(cat){ currentCategory = cat; favoritesOnly = false; renderCatalog(); }
function setSort(sortMode){ currentSort = sortMode; renderCatalog(); }
function setView(viewMode){ currentView = viewMode; renderCatalog(); }

let searchTimer;
function onSearchInput(el){
  searchQuery = el.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(updateSearchResults, 120);
}
function updateSearchResults(){
  const container = document.getElementById('productContainer');
  if(!container) return;
  let filtered = allProducts.filter(item=>{
    const name = String(item["Parfüm Adı"] || "").toLowerCase();
    const cat = String(item["Kategori"] || "").trim();
    return name.includes(searchQuery.toLowerCase()) && (currentCategory === "Tümü" || cat.toLowerCase() === currentCategory.toLowerCase()) && (!favoritesOnly || favorites.has(favoriteKey(item)));
  });
  if(currentSort === "price-asc") filtered.sort((a,b)=>Number(a["Fiyat"]||0)-Number(b["Fiyat"]||0));
  if(currentSort === "price-desc") filtered.sort((a,b)=>Number(b["Fiyat"]||0)-Number(a["Fiyat"]||0));
  container.innerHTML = renderProductContent(filtered);
  const badge = document.querySelector('.product-count-badge');
  if(badge) badge.innerHTML = `<b>${filtered.length}</b> ürün listeleniyor${currentCategory !== 'Tümü' ? ` · ${currentCategory}` : ''}`;
  const sheetCount = document.querySelector('.sheet-apply b');
  if(sheetCount) sheetCount.textContent = filtered.length;
}

function goToDetail(index){
  activeImageIdx = 0;
  filterSheetOpen = false; document.body.classList.remove('sheet-open');
  const newUrl = window.location.pathname + '?urun=' + index;
  window.history.pushState({path:newUrl}, '', newUrl);
  handleRoute();
  window.scrollTo({top:0, behavior:'smooth'});
}

function goBackToCatalog(){
  const newUrl = window.location.pathname;
  window.history.pushState({path:newUrl}, '', newUrl);
  handleRoute();
  window.scrollTo({top:0, behavior:'smooth'});
}

function setActiveImage(idx){
  activeImageIdx = idx;
  const params = new URLSearchParams(window.location.search);
  const idxParam = params.get('urun');
  if(idxParam !== null){ renderDetail(allProducts[idxParam], idxParam); }
}

function openLightbox(idx){
  const params = new URLSearchParams(window.location.search);
  const item = allProducts[params.get('urun')];
  const imgs = getImages(item);
  if(!imgs[idx]) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `
    <button class="lightbox-close" onclick="this.parentElement.remove()">✕</button>
    <img src="${imgs[idx]}" alt="">`;
  lb.onclick = (e)=>{ if(e.target === lb) lb.remove(); };
  document.body.appendChild(lb);
}

function orderWhatsApp(name, url){
  const text = `Merhabalar, bu ürün hakkında bilgi almak ve sipariş vermek istiyorum: ${name} (${url})`;
  window.open(`https://wa.me/905349762141?text=${encodeURIComponent(text)}`, '_blank');
}

async function shareProduct(name, url){
  if(navigator.share){
    try{ await navigator.share({title:name, url:url}); }catch(e){}
  } else if(navigator.clipboard && window.isSecureContext){
    try { await navigator.clipboard.writeText(url); alert("Ürün bağlantısı panoya kopyalandı!"); }
    catch(e) { window.prompt("Ürün bağlantısını kopyalayın:", url); }
  } else {
    window.prompt("Ürün bağlantısını kopyalayın:", url);
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const lightbox = document.querySelector('.lightbox');
    if(lightbox) lightbox.remove();
    if(document.getElementById('adminModal')) closeEditModal();
  }
});

window.onpopstate = () => { handleRoute(); };

document.getElementById('tickerRoot').innerHTML = brandTicker();
updateFavoriteCount();
initApp();
</script>
